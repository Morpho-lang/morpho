# Install MorphoInstaller.exe from a tagged release on a GitHub-hosted
# Windows runner (a Windows Server virtual machine) and run it.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that contains MorphoInstaller.exe
        required: false
        default: v0.6.5-beta
        type: string
  push:
    branches: ["dev"]
    paths:
      - .github/workflows/windows-installer.yml
      - .github/scripts/test-windows-installer.ps1

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      INSTALLER_TAG: ${{ github.event.inputs.tag || 'v0.6.5-beta' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install release and smoke-test morpho6
        shell: pwsh
        run: .\.github\scripts\test-windows-installer.ps1

      - name: Language test suite
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install regex colored
          Set-Location test
          python test.py -c
